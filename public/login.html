<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso · KNJ CRM</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1322;color:#eaf0ff;font:16px system-ui,sans-serif}main{box-sizing:border-box;width:min(420px,92vw);background:#182237;border:1px solid #34435c;border-radius:18px;padding:30px}h1{margin:0 0 8px}p{color:#aebdd4}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;border-radius:9px;padding:13px;font:inherit}input{background:#0c1322;border:1px solid #52617a;color:white}button{margin-top:22px;background:#4d89ff;border:0;color:white;cursor:pointer}button:disabled{opacity:.6}#error{color:#ffacac;min-height:22px}</style></head>
<body><main><h1>KNJ CRM</h1><p>Ingresá con tu cuenta de operador o administrador.</p><form id="login"><label for="usuario">Usuario</label><input id="usuario" autocomplete="username" required maxlength="40"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Iniciar sesión</button><p id="error" role="alert"></p></form></main>
<script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit');const error=document.getElementById('error');button.disabled=true;error.textContent='';try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({usuario:document.getElementById('usuario').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Error de acceso');location.replace('/')}catch(err){error.textContent=err.message}finally{button.disabled=false}})</script></body></html>
